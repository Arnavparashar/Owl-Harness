[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "owl-harness"
version = "0.1.0"
description = "Owl Harness: a small model evaluation harness with a FastAPI backend and React dashboard"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.148.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "typer==0.27.3",
]

[project.optional-dependencies]
# Hugging Face datasets (needed by the built-in prompt_injection task)
hf = ["datasets==5.1.0"]
# Laya decision-model provider (pulls in CPU torch from PyPI)
laya = ["laya==0.4.12"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
owl = "owl.cli:app"

# Built-in providers are registered through the same entry point group that
# third-party plugins use.
[project.entry-points."owl.providers"]
mock = "owl.providers.mock:MockProvider"
ollama = "owl.providers.ollama:OllamaProvider"
openai = "owl.providers.openai:OpenAIProvider"
laya = "owl.providers.laya:LayaProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/owl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
